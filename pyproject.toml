[project]
name = "freal"
version = "0.3.0"
description = "Who's for real? Advanced metrics for ESPN fantasy football leagues"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "espn-api==1.0.1",
    "fastapi==0.163.0",
    "mangum==0.22.0",
    "pydantic==2.14.3",
    "pyjwt[crypto]==2.15.1",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3==1.44.3",
    "boto3-stubs[ssm]==1.44.3",
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "uvicorn==0.54.0",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = "espn_api.*"
ignore_missing_imports = true
