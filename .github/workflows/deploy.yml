---
name: Deploy

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ljhurst/stych/.github/workflows/terraform.yml@v1
    with:
      plan-role-arn: arn:aws:iam::755958650241:role/stych/freal-ci-plan
      apply-role-arn: arn:aws:iam::755958650241:role/stych/freal-ci-apply
      build-command: scripts/build_lambda.sh
      setup-uv: true

  site:
    needs: terraform
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      deployments: write
    uses: ljhurst/stych/.github/workflows/static-site.yml@v1
    with:
      plan-role-arn: arn:aws:iam::755958650241:role/stych/freal-ci-plan
      apply-role-arn: arn:aws:iam::755958650241:role/stych/freal-ci-apply
      bucket: lj-freal
      distribution-id: E3LEW06N6O8OV1
      node-version-file: frontend/.nvmrc
      build-command: >-
        cd frontend && npm ci && npm run build
        && mkdir -p ../site && cp -r dist/. ../site/
